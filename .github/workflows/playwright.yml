name: Project Checks
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: TypeScript check
      run: npx tsc --noEmit
    - name: Lint
      run: npx eslint pages/acompanhamento-processual.page.ts pages/pesquisa-processos.page.ts pages/processos.config.ts tests/acompanhamento-processual.spec.ts
